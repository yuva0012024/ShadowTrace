<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae18b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7620" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e26" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <polygon points="50,6 88,22 88,60 50,94 12,60 12,22" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Reticle Rings -->
  <circle cx="50" cy="48" r="26" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="50" cy="48" r="16" stroke="url(#goldGrad)" stroke-width="1.5" />
  <!-- Center Core -->
  <circle cx="50" cy="48" r="4" fill="url(#goldGrad)" />
  <!-- Radar Crosshairs -->
  <line x1="50" y1="26" x2="50" y2="70" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="48" x2="72" y2="48" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Subtle corner accents -->
  <polygon points="50,14 54,20 46,20" fill="#d4af37" />
</svg>
