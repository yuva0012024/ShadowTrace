<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="goldEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae18b" />
      <stop offset="50%" stop-color="#c8a23a" />
      <stop offset="100%" stop-color="#7a5d24" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#c8a23a" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Fedora Crown Profile -->
  <path d="M15 23 C15 15, 18.5 10.5, 24 10.5 C29.5 10.5, 33 15, 33 23 Z" stroke="url(#goldEmblemGrad)" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#goldGlow)"/>
  <!-- Top Center Pinch -->
  <path d="M21.5 10.5 C23 13.5, 25 13.5, 26.5 10.5" stroke="url(#goldEmblemGrad)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Fedora Ribbon -->
  <path d="M15 21.5 Q24 23.5 33 21.5" stroke="url(#goldEmblemGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Wide Curving Brim -->
  <path d="M7.5 24.5 C13.5 27 34.5 27 40.5 24.5 C42 24 42.5 25.5 40.5 26.5 C33.5 29.5 14.5 29.5 7.5 26.5 C5.5 25.5 6 24 7.5 24.5 Z" fill="url(#goldEmblemGrad)" stroke="url(#goldEmblemGrad)" stroke-width="0.8" filter="url(#goldGlow)"/>
  <!-- Crossed Reticle Needle Accents -->
  <line x1="19.5" y1="33" x2="28.5" y2="42" stroke="url(#goldEmblemGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="28.5" y1="33" x2="19.5" y2="42" stroke="url(#goldEmblemGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="24" cy="37.5" r="1.5" fill="#fae18b" />
</svg>
