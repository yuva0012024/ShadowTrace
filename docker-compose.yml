version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: shadowtrace-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shadowtrace
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowtrace-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/shadowtrace
      - GEOLOCATION_API_URL=http://ip-api.com/json
      - JAVA_SERVICE_URL=http://java-service:8080
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: shadowtrace-java-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JAVA_SERVICE_PORT=8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadowtrace-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
